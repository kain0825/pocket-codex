name: Host checks
on: [push, pull_request]
jobs:
  python:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Synthetic host regression
        working-directory: host/codex_sync
        env:
          POCKET_THREAD_ID: '11111111-1111-4111-8111-111111111111'
        run: python -m unittest discover -s . -p 'test_*.py'
      - name: Build Windows adapter
        working-directory: host/codex_sync
        shell: powershell
        run: .\build_task_control.ps1
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test host/monitor/control-tests.cjs
